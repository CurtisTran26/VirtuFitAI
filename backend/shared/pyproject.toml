[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtufit-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "SQLAlchemy==2.0.38", "psycopg[binary]==3.2.5", "passlib[bcrypt]==1.7.4"]

[tool.setuptools]
py-modules = ["shared_platform", "order_service"]
